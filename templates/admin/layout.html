<!doctype html>
<html lang="en">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
    <title>SU5 Ecommerce</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes"/>
    <meta name="color-scheme" content="light dark"/>
    <meta name="theme-color" content="#007bff" media="(prefers-color-scheme: light)"/>
    <meta name="theme-color" content="#1a1a1a" media="(prefers-color-scheme: dark)"/>


    <meta name="title" content="AdminLTE 4 | Starter Page"/>
    <meta name="author" content="ColorlibHQ"/>
    <meta
            name="description"
            content="AdminLTE is a free Bootstrap 5 admin dashboard template with almost 50 example pages, built with vanilla JS and designed with accessibility in mind."
    />
    <meta
            name="keywords"
            content="bootstrap 5, bootstrap, bootstrap 5 admin dashboard, bootstrap 5 dashboard, bootstrap 5 charts, bootstrap 5 calendar, bootstrap 5 datepicker, bootstrap 5 tables, bootstrap 5 datatable, vanilla js datatable, colorlibhq, colorlibhq dashboard, colorlibhq admin dashboard, accessible admin panel"
    />
    <meta name="supported-color-schemes" content="light dark"/>
    <link rel="stylesheet" href="{{ url_for('static', filename="css/adminlte.css") }}"/>
    <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/@fontsource/source-sans-3@5.0.12/index.css"
            integrity="sha256-tXJfXfp6Ewt1ilPzLDtQnJV4hclT9XuaZUKyUvmyr+Q="
            crossorigin="anonymous"
            media="print"
            onload="this.media = 'all'"
    />
    <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
            crossorigin="anonymous"
    />
    <link rel="stylesheet" href="{{ url_for('static', filename="css/adminlte.css") }}"/>
</head>

<body class="layout-fixed sidebar-expand-lg bg-body-tertiary">

<div class="app-wrapper">
    {# NavBar #}
    <nav class="app-header navbar navbar-expand bg-body">
        <div class="container-fluid">

            <!--begin::End Navbar Links-->
            <ul class="navbar-nav ms-auto">
                <li class="nav-item d-md-none">
                    <a class="nav-link" href="./pages/search-results.html" aria-label="Search">
                        <i class="bi bi-search" aria-hidden="true"></i>
                    </a>
                </li>

                <!--begin::User Menu Dropdown-->
                <li class="nav-item dropdown user-menu">
                    <a href="#" class="nav-link dropdown-toggle" data-bs-toggle="dropdown">
                        <img
                                src="./assets/img/user2-160x160.jpg"
                                class="user-image rounded-circle shadow"
                                alt="Alexander Pierce"
                        />
                        <span class="d-none d-md-inline">Alexander Pierce</span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-lg dropdown-menu-end">
                        <!--begin::User Image-->
                        <li class="user-header text-bg-primary">
                            <img
                                    src="./assets/img/user2-160x160.jpg"
                                    class="rounded-circle shadow"
                                    alt="Alexander Pierce"
                            />
                            <p>
                                Alexander Pierce - Web Developer
                                <small>Member since Nov. 2023</small>
                            </p>
                        </li>
                        <li class="user-footer">
                            <a href="#" class="btn btn-outline-secondary">Profile</a>
                            <a href="#" class="btn btn-outline-danger float-end">Sign out</a>
                        </li>
                    </ul>
                </li>
            </ul>
        </div>
    </nav>

    {#SideBar#}
    <aside
            class="app-sidebar bg-body-secondary shadow"
            data-bs-theme="dark"
    >
        <div class="sidebar-brand">
            <a href="./index.html" class="brand-link">
                <img
                        src="{{ url_for('static', filename="image/logo.png") }}"
                        alt="SU5 Logo"
                        class="brand-image opacity-75 shadow"
                />
                <span class="brand-text fw-light">SU5</span>
            </a>
        </div>


        <!--begin::Sidebar Wrapper-->
        <div class="sidebar-wrapper">
            <nav class="mt-2" aria-label="Main navigation">
                <!--begin::Sidebar Menu-->
                <ul
                        class="nav sidebar-menu flex-column"
                        data-lte-toggle="treeview"
                        data-accordion="false"
                        id="navigation"
                >
                    <li class="nav-item">
                        <a href="{{ url_for('dashboard') }}" class="nav-link {{ 'active' if  module == 'dashboard' }}">
                            <i class="nav-icon bi bi-speedometer2"></i>
                            <p>Dashboard</p>

                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="{{ url_for('user') }}" class="nav-link {{ 'active' if  module == 'user' }}">
                            <i class="nav-icon bi bi-people"></i>
                            <p>User</p>
                        </a>
                    </li>
                </ul>

            </nav>
        </div>
    </aside>

    {# Content #}
    {% block content %}
    {% endblock %}


    <footer class="app-footer">
        <div class="float-end d-none d-sm-inline">Anything you want</div>
        <strong>
            Copyright &copy; 2014-2026&nbsp;
            <a href="https://adminlte.io" class="text-decoration-none">SU5</a>.
        </strong>
        All rights reserved.
    </footer>
</div>

<script
        src="https://cdn.jsdelivr.net/npm/overlayscrollbars@2.11.0/browser/overlayscrollbars.browser.es6.min.js"
        crossorigin="anonymous"
></script>
<script
        src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        crossorigin="anonymous"
></script>
<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
        crossorigin="anonymous"
></script>
<script src="{{ url_for('static', filename='js/adminlte.js') }}"></script>
</body>
</html>
